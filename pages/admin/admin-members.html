<!doctype html>
<html lang="ko">
<head>

    <h1 class="page-title">회원 관리</h1>

    <div class="m-tabs" id="roles" role="tablist" aria-label="회원 유형"></div>

    <form class="am-search" id="search" role="search">
      <label class="mg-search">
        <span class="sr-only">아이디나 닉네임 검색</span>
        <input id="keyword" type="search" maxlength="20" placeholder="아이디·닉네임 검색 (예: owner)" autocomplete="off" spellcheck="false">
      </label>
      <span class="am-count" id="count" aria-live="polite"></span>

    <div id="list"><div class="sk sk-block"></div></div>
