<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테마 승인 상세 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/manage.css">
</head>
<body>
  <!-- S24 테마 승인 상세 · C-18 상세, C-19 승인·반려
       관리자 개편 11/23: 맨 위 한 줄(이름·상태 / 매장·신청자·신청일·수정일 + 승인/반려) → 테마 → 매장 -->
  <main class="page m-page" id="main">
    <a class="m-back" id="back">← 승인 요청</a>
    <div class="ad-head">
      <div>
        <h1><span id="name">테마</span> <span id="status"></span></h1>
        <div class="ad-meta" id="meta"></div>
      </div>
      <div class="ad-actions" id="decide" hidden>
        <span class="lock" id="lock" hidden>매장 승인 전이라 승인할 수 없어요</span>
        <button class="btn btn-no" type="button" id="reject-btn">반려</button>
        <button class="btn btn-ok" type="button" id="approve">승인</button>
      </div>
    </div>
    <div id="reject"></div>
    <div id="body"><div class="sk sk-block" style="margin-top:24px"></div></div>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/owner/manage.js"></script>
  <script src="../../js/admin/admin-theme-detail.js"></script>
</body>
</html>
