<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테마 상세 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <!-- 후기 팝업(D) 모양. detail.css 보다 먼저: 이름이 겹치는 .rv-stars 는 detail.css 가 이김 -->
  <link rel="stylesheet" href="../../css/review.css">
  <link rel="stylesheet" href="../../css/detail.css">
</head>
<body>
  <!-- S09 테마 상세 · B-2 상세, B-3 시간표, D-4 후기, B-4/B-5 찜, B-10 같은 매장 테마 -->
  <section class="d-hero" id="d-hero">
    <div class="d-hero-bg" id="d-bg"></div>
    <div class="d-hero-shade"></div>
    <div class="d-hero-inner">
      <div class="d-hero-text" id="d-text">
        <div class="sk" style="height:52px;width:min(440px,80vw);margin-bottom:14px"></div>
        <div class="sk" style="height:18px;width:min(320px,60vw)"></div>
      </div>
    </div>
  </section>

  <main class="d-body" id="d-body" hidden>
    <!-- 테마 소개: 왼쪽 포스터(2:3 고정 크기) + 오른쪽 제목·설명
         설명은 포스터 높이까지만 보이고, 넘칠 때만 더 보기 (theme.js longText)
         위쪽 큰 화면 배경은 잘린 사진이라, 포스터 전체는 여기서 보여 줌 -->
    <section class="d-sec" id="intro-sec" aria-labelledby="intro-h" hidden>
      <div class="d-intro">
        <div class="d-poster" id="d-poster"></div>
        <div class="d-intro-text" id="intro">
          <h2 id="intro-h">테마 소개</h2>
        </div>
      </div>
    </section>

    <section class="d-sec" aria-labelledby="slot-h">
      <div class="d-sec-head">
        <h2 id="slot-h">시간표</h2>
      </div>
      <div class="date-strip" id="date-strip" role="tablist" aria-label="날짜 고르기"></div>
      <div class="slots" id="slots" aria-live="polite"></div>
    </section>

    <section class="d-sec" aria-labelledby="review-h">
      <div class="d-sec-head">
        <h2 id="review-h">후기</h2>
        <button class="btn btn-line small" id="write-review" type="button" hidden>✎ 후기 쓰기</button>
      </div>
      <div class="review-summary" id="review-summary"></div>
      <div class="reviews" id="reviews"></div>
      <nav class="pager" id="review-pager" aria-label="후기 페이지" hidden></nav>
    </section>

    <!-- 매장 정보: 매장 카드 (사진 · 이름 · 주소 · 전화 · 영업시간 · 매장 보기) -->
    <section class="d-sec" aria-labelledby="info-h">
      <h2 id="info-h">매장 정보</h2>
      <div id="store-card"></div>
    </section>
  </main>

  <div id="more-rows"></div>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/mypage/review-modal.js"></script>
  <script src="../../js/theme/theme.js"></script>
</body>
</html>
