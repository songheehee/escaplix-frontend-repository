<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/stores.css">
  <link rel="stylesheet" href="../../css/member.css">
  <!-- 로그인 정보(Auth)를 화면 그리기 전에 읽으려고 이 두 개는 위에서 먼저 불러옴 (제목 깜빡임 방지) -->
  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
</head>
<body>
  <!-- S26 내 정보 (마이페이지 탭, 사장·관리자도 씀) · A-7 내 정보, A-8 닉네임, A-9 비밀번호, A-4 닉네임 중복, D-7·D-8 선호 장르 -->
  <main class="page">
    <h1 class="page-title" id="p-title">내 정보</h1>
    <!-- 손님만 마이페이지 탭 -->
    <nav class="my-tabs" id="my-tabs" aria-label="마이페이지 탭" hidden>
      <a id="tab-mypage" href="#">내 기록</a>
      <a id="tab-wishes" href="#">찜 목록</a>
      <a id="tab-chats" href="#">내 채팅</a>
      <a id="tab-profile" href="#" aria-current="page">내 정보</a>
    </nav>
    <!-- 손님이면 닉네임 제목과 탭을 처음부터 그려 둠 (JS 가 나중에 바꾸면 깜빡여서) -->
    <script>(function () { var m = Auth.me(); if (m && m.role === "USER") { document.getElementById("p-title").textContent = m.nickname + " 님의 마이페이지"; document.getElementById("my-tabs").hidden = false; } })();</script>

    <div class="profile-wrap" id="profile" aria-busy="true">
      <div class="sk profile-sk"></div>
    </div>

    <!-- 한 카드에 줄 하나씩: 아이디 · 비밀번호 · 닉네임 · 선호 장르. [수정]을 누르면 팝업에서 고침 -->
    <template id="profile-tpl">
      <section class="pcard" aria-labelledby="pcard-title">
        <h2 class="pcard-head" id="pcard-title">계정 정보</h2>
        <ul class="plist">
          <li class="prow">
            <svg class="prow-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <span class="prow-k">아이디</span>
            <span class="prow-v" id="v-loginId"></span>
          </li>
          <li class="prow" id="row-biz" hidden>
            <svg class="prow-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/></svg>
            <span class="prow-k">사업자등록번호</span>
            <span class="prow-v" id="v-biz"></span>
          </li>
          <li class="prow">
            <svg class="prow-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/></svg>
            <span class="prow-k">비밀번호</span>
            <span class="prow-v"></span>
            <button class="prow-btn" id="pw-edit" type="button" aria-label="비밀번호 수정">수정</button>
          </li>
          <li class="prow">
            <svg class="prow-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>
            <span class="prow-k">닉네임</span>
            <span class="prow-v" id="v-nickname"></span>
            <button class="prow-btn" id="nick-edit" type="button" aria-label="닉네임 수정">수정</button>
          </li>
          <li class="prow" id="row-genre" hidden>
            <svg class="prow-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>
            <span class="prow-k">선호 장르</span>
            <span class="prow-v" id="v-genres"></span>
            <button class="prow-btn" id="genre-edit" type="button" aria-label="선호 장르 수정">수정</button>
          </li>
        </ul>
      </section>
    </template>

    <!-- 비밀번호 수정 팝업 (A-9) -->
    <dialog class="pdlg" id="pw-dialog" aria-labelledby="pw-title">
      <form id="pw-form" novalidate>
        <div class="pdlg-head">
          <h2 id="pw-title">비밀번호 수정</h2>
          <button class="pdlg-x" type="button" data-close aria-label="닫기">✕</button>
        </div>
        <input type="text" autocomplete="username" id="pw-user" hidden>
        <div class="field">
          <label for="pw-now">현재 비밀번호</label>
          <input class="input" id="pw-now" type="password" autocomplete="current-password" maxlength="20" aria-describedby="pw-now-msg">
          <p class="field-msg" id="pw-now-msg" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="pw-new">새 비밀번호</label>
          <input class="input" id="pw-new" type="password" autocomplete="new-password" maxlength="20" placeholder="4~20자" aria-describedby="pw-new-msg">
          <p class="field-msg" id="pw-new-msg" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="pw-new2">새 비밀번호 확인</label>
          <input class="input" id="pw-new2" type="password" autocomplete="new-password" maxlength="20" aria-describedby="pw-new2-msg">
          <p class="field-msg" id="pw-new2-msg" aria-live="polite"></p>
        </div>
        <div class="pdlg-foot">
          <button class="btn btn-line" type="button" data-close>취소</button>
          <button class="btn btn-accent" id="pw-save" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <!-- 닉네임 수정 팝업 (A-8, 중복 확인 A-4) -->
    <dialog class="pdlg" id="nick-dialog" aria-labelledby="nick-title">
      <form id="nick-form" novalidate>
        <div class="pdlg-head">
          <h2 id="nick-title">닉네임 수정</h2>
          <button class="pdlg-x" type="button" data-close aria-label="닫기">✕</button>
        </div>
        <div class="field">
          <label for="nickname">새 닉네임</label>
          <div class="input-row">
            <input class="input" id="nickname" maxlength="20" aria-describedby="nickname-msg">
            <button class="btn btn-line" id="nickname-check" type="button">중복 확인</button>
          </div>
          <p class="field-msg" id="nickname-msg" aria-live="polite"></p>
        </div>
        <div class="pdlg-foot">
          <button class="btn btn-line" type="button" data-close>취소</button>
          <button class="btn btn-accent" id="nick-save" type="submit" disabled>저장</button>
        </div>
      </form>
    </dialog>

    <!-- 선호 장르 수정 팝업 (D-7 보기, D-8 저장) · 손님만 -->
    <dialog class="pdlg" id="genre-dialog" aria-labelledby="genre-title">
      <form id="genre-form" novalidate>
        <div class="pdlg-head">
          <h2 id="genre-title">선호 장르 수정</h2>
          <button class="pdlg-x" type="button" data-close aria-label="닫기">✕</button>
        </div>
        <div class="gchips" id="genres"></div>
        <p class="field-msg" id="genre-msg" aria-live="polite"></p>
        <div class="pdlg-foot">
          <button class="btn btn-line" type="button" data-close>취소</button>
          <button class="btn btn-accent" id="genre-save" type="submit">저장</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/member/member-form.js"></script>
  <script src="../../js/mypage/profile.js"></script>
</body>
</html>
