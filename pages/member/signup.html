<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/member.css">
</head>
<body>
  <!-- S03 가입 유형 고르기 (API 없음) -->
  <main class="page auth-page">
    <section class="auth-box" style="--auth-w: 640px">
      <h1>회원가입</h1>

      <div class="choose">
        <!-- 카드 어디를 눌러도 가입 화면으로. 오른쪽 아래 체크 표시 (마우스를 올리면 보라색) -->
        <a class="choose-card" id="go-user" href="#">
          <span class="choose-ico ico-user" aria-hidden="true"></span>
          <strong class="choose-ttl">고객으로 가입</strong>
          <span class="choose-desc">방탈출카페를 이용하는 고객이에요.</span>
          <span class="choose-check" aria-hidden="true"></span>
        </a>
        <a class="choose-card" id="go-owner" href="#">
          <span class="choose-ico ico-store" aria-hidden="true"></span>
          <strong class="choose-ttl">사장으로 가입</strong>
          <span class="choose-desc">방탈출카페를 운영하는 사장이에요.</span>
          <span class="choose-check" aria-hidden="true"></span>
        </a>
      </div>

      <p class="auth-foot">이미 회원이신가요? <a id="login-link" href="#">로그인</a></p>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/member/signup.js"></script>
</body>
</html>
