<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/member.css">
</head>
<body>
  <!-- S02 로그인 · A-6 -->
  <main class="page auth-page">
    <section class="auth-box">
      <h1>로그인</h1>
      <p class="lead">파티 모집, 찜, 후기는 로그인하고 쓸 수 있어요.</p>

      <form class="auth-card" id="login-form" novalidate>
        <p class="form-info" id="login-info" role="status" hidden></p>
        <p class="form-error" id="login-error" role="alert" hidden></p>

        <div class="field">
          <label for="loginId">아이디</label>
          <input class="input" id="loginId" name="loginId" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="btn btn-accent block" id="login-btn" type="submit">로그인</button>
        <p class="auth-foot">아직 회원이 아니신가요? <a id="signup-link" href="#">회원가입</a></p>
      </form>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/member/login.js"></script>
</body>
</html>
