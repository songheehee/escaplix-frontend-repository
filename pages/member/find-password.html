<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/member.css">
</head>
<body>
  <!-- 비밀번호 찾기 · 아이디 + 가입 이메일 인증 → 새 비밀번호 (POST /api/auth/password-reset/code · /verify · /password-reset) -->
  <main class="page auth-page">
    <section class="auth-box" style="--auth-w: 460px">
      <a class="back-link" id="back-link" href="#">← 로그인</a>
      <h1>비밀번호 찾기</h1>

      <form class="auth-card steps-open" id="reset-form" novalidate>
        <p class="form-error" id="form-error" role="alert" hidden></p>

        <div class="field">
          <label for="loginId">아이디</label>
          <input class="input" id="loginId" autocomplete="username" autocapitalize="off" spellcheck="false"
                 maxlength="20" aria-describedby="loginId-msg">
          <p class="field-msg" id="loginId-msg" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">가입한 이메일</label>
          <div class="input-row">
            <input class="input" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"
                   maxlength="100" aria-describedby="email-msg">
            <button class="btn btn-line" id="email-send" type="button">인증번호 전송</button>
          </div>
          <p class="field-msg" id="email-msg" aria-live="polite"></p>
          <div class="input-row code-row" id="email-code-row" hidden>
            <label class="sr-only" for="email-code">인증번호 6자리</label>
            <input class="input" id="email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   placeholder="인증번호 6자리" aria-describedby="email-code-msg" disabled>
            <button class="btn btn-line" id="email-verify" type="button" disabled>확인</button>
          </div>
          <p class="field-msg" id="email-code-msg" aria-live="polite"></p>
        </div>

        <!-- 처음부터 보이지만 꺼져 있음. 인증을 마치면 켜짐 -->
        <div id="new-pw">
          <div class="field">
            <label for="password">새 비밀번호</label>
            <input class="input" id="password" type="password" autocomplete="new-password" maxlength="20"
                   placeholder="4~20자" aria-describedby="password-msg" disabled>
            <p class="field-msg" id="password-msg" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="password2">새 비밀번호 확인</label>
            <input class="input" id="password2" type="password" autocomplete="new-password" maxlength="20" aria-describedby="password2-msg" disabled>
            <p class="field-msg" id="password2-msg" aria-live="polite"></p>
          </div>
          <button class="btn btn-accent block" id="submit-btn" type="submit" disabled>비밀번호 바꾸기</button>
        </div>

      </form>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/member/member-form.js"></script>
  <script src="../../js/member/find-password.js"></script>
</body>
</html>
