<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 찾기 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/member.css">
</head>
<body>
  <!-- 아이디 찾기 · 가입한 이메일로 아이디를 메일로 받음 (POST /api/auth/find-id) -->
  <main class="page auth-page">
    <section class="auth-box">
      <a class="back-link" id="back-link" href="#">← 로그인</a>
      <h1>아이디 찾기</h1>

      <form class="auth-card" id="find-form" novalidate>
        <p class="form-info" id="find-info" role="status" hidden></p>
        <p class="form-error" id="find-error" role="alert" hidden></p>

        <div class="field">
          <label for="email">가입한 이메일</label>
          <!-- [아이디 받기]는 칸 오른쪽 작은 버튼 (가입 화면 [중복 확인]·[인증번호 전송]과 같은 모양) -->
          <div class="input-row">
            <input class="input" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"
                   maxlength="100" aria-describedby="email-msg">
            <button class="btn btn-line" id="find-btn" type="submit">아이디 받기</button>
          </div>
          <p class="field-msg" id="email-msg" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/member/member-form.js"></script>
  <script src="../../js/member/find-id.js"></script>
</body>
</html>
