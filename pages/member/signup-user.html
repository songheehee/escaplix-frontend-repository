<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 회원가입 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/member.css">
</head>
<body>
  <!-- S03-1 손님 회원가입 · A-1 가입, A-3 아이디 중복, A-4 닉네임 중복, B-7 장르 목록 -->
  <main class="page auth-page">
    <section class="auth-box" style="--auth-w: 460px">
      <a class="back-link" id="back-link" href="#">← 회원 유형 선택</a>
      <h1>고객 회원가입</h1>

      <form class="auth-card" id="signup-form" novalidate>
        <p class="form-error" id="form-error" role="alert" hidden></p>

        <div class="field">
          <label for="loginId">아이디<span class="req">*</span></label>
          <div class="input-row">
            <input class="input" id="loginId" name="loginId" autocomplete="username" autocapitalize="off" spellcheck="false"
                   maxlength="20" placeholder="4~20자 (영문/소문자)" aria-describedby="loginId-msg">
            <button class="btn btn-line" id="loginId-check" type="button">중복 확인</button>
          </div>
          <p class="field-msg" id="loginId-msg" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">비밀번호<span class="req">*</span></label>
          <input class="input" id="password" type="password" autocomplete="new-password" maxlength="20"
                 placeholder="4~20자" aria-describedby="password-msg">
          <p class="field-msg" id="password-msg" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="password2">비밀번호 확인<span class="req">*</span></label>
          <input class="input" id="password2" type="password" autocomplete="new-password" maxlength="20" aria-describedby="password2-msg">
          <p class="field-msg" id="password2-msg" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="nickname">닉네임<span class="req">*</span></label>
          <div class="input-row">
            <input class="input" id="nickname" maxlength="20" placeholder="2~20자" aria-describedby="nickname-msg">
            <button class="btn btn-line" id="nickname-check" type="button">중복 확인</button>
          </div>
          <p class="field-msg" id="nickname-msg" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">이메일<span class="req">*</span></label>
          <div class="input-row">
            <input class="input" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"
                   maxlength="100" aria-describedby="email-msg">
            <button class="btn btn-line" id="email-send" type="button">인증번호 전송</button>
          </div>
          <p class="field-msg" id="email-msg" aria-live="polite"></p>
          <div class="input-row code-row" id="email-code-row" hidden>
            <label class="sr-only" for="email-code">인증번호 6자리</label>
            <input class="input" id="email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   placeholder="인증번호 6자리" aria-describedby="email-code-msg">
            <button class="btn btn-line" id="email-verify" type="button">확인</button>
          </div>
          <p class="field-msg" id="email-code-msg" aria-live="polite"></p>
        </div>

        <fieldset class="field genre-field">
          <legend class="label">좋아하는 장르 <span class="muted">(복수선택 가능)</span></legend>
          <div class="gchips" id="genres" aria-live="polite"></div>
        </fieldset>

        <button class="btn btn-accent block" id="submit-btn" type="submit">가입하기</button>
        <p class="auth-foot">이미 회원이신가요? <a id="login-link" href="#">로그인</a></p>
      </form>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/member/member-form.js"></script>
  <script src="../../js/member/signup-user.js"></script>
</body>
</html>
