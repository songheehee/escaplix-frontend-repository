<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매장 등록 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/manage.css">
</head>
<body>
  <!-- S21 매장 등록·수정 · C-1 (수정할 때 처음 값), C-2 번호 중복 확인, C-3 등록, C-4 수정
       관리자 개편 11/23: 매장 → 서류 (승인 상세와 같은 순서)
       주소는 다음 우편번호 서비스로 고르고 상세 주소만 직접. 좌표는 서버가 주소로 채움 (위도·경도 칸 없음) -->
  <main class="page m-page narrow" id="main">
    <nav class="m-crumbs" id="crumbs" aria-label="경로"></nav>
    <h1 class="page-title" id="title">매장 등록</h1>

    <form class="m-form" id="form" novalidate>
      <div class="m-notice" id="re-approve" hidden>
        매장을 수정하면 <b>다시 승인 대기</b>가 돼요. 관리자가 승인할 때까지 이 매장과 테마가 손님 화면에 보이지 않아요.
      </div>
      <div class="m-error" id="error" role="alert" hidden></div>

      <section class="f-sec">
        <h2>매장</h2>
        <div class="m-card m-form">
          <div class="m-field">
            <label for="name">매장 이름<span class="req">*</span></label>
            <input type="text" id="name" maxlength="50" placeholder="예: 미스터리룸 합정점">
          </div>

          <div class="m-field">
            <label for="addr1">주소<span class="req">*</span></label>
            <div class="m-inline">
              <input type="text" id="addr1" readonly placeholder="주소 검색을 눌러 주세요">
              <button class="btn btn-line small" type="button" id="find-addr">주소 검색</button>
            </div>
            <input type="text" id="addr2" maxlength="40" placeholder="상세 주소 (예: 지하 1층)" aria-label="상세 주소">
          </div>

          <div class="f-row2">
            <div class="m-field">
              <span class="lbl" id="area-lbl">지역<span class="req">*</span><span class="f-auto" id="area-auto" hidden></span></span>
              <div id="area-box"></div>
            </div>
            <div class="m-field">
              <label for="phone">전화번호<span class="req">*</span></label>
              <input type="tel" id="phone" inputmode="tel" maxlength="13" placeholder="02-000-0000">
            </div>
          </div>

          <div class="f-row2">
            <div class="m-field">
              <label for="hours">영업시간<span class="req">*</span></label>
              <input type="text" id="hours" maxlength="50" placeholder="예: 10:00 ~ 23:00 (화 휴무)">
            </div>
            <div class="m-field">
              <label for="websiteUrl">웹사이트<span class="req">*</span></label>
              <input type="url" id="websiteUrl" maxlength="500" placeholder="https://">
            </div>
          </div>

          <div class="f-pair">
            <div class="f-col">
              <span class="lbl">매장 사진</span>
              <label class="f-drop photo" id="photo-drop"><span><b>사진 올리기</b>누르거나 끌어다 놓기</span><input type="file" id="storePhoto" accept="image/jpeg,image/png,image/webp" aria-label="매장 사진"></label>
            </div>
            <div class="f-col">
              <label for="intro">매장 소개<span class="req">*</span></label>
              <div class="f-ta">
                <textarea id="intro" maxlength="200" placeholder="찾아오는 길, 매장 분위기 등"></textarea>
                <p class="hint m-count" id="intro-count"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="f-sec">
        <h2>서류</h2>
        <div class="m-card m-form">
          <div class="m-field">
            <label for="bizPlaceNo">사업장 등록번호<span class="req">*</span></label>
            <div class="m-inline">
              <input type="text" id="bizPlaceNo" maxlength="12" placeholder="123-45-67890" inputmode="numeric">
              <button class="btn btn-line small" type="button" id="check-no">중복 확인</button>
            </div>
            <p class="hint" id="bizPlaceNo-hint"></p>
          </div>
          <div class="m-field">
            <span class="lbl">사업장등록증<span class="req" id="file-req">*</span><span class="muted" id="file-opt" hidden> (선택)</span></span>
            <label class="f-drop doc" id="doc-drop"><span id="doc-empty"><b>등록증 올리기</b>누르거나 끌어다 놓기</span><input type="file" id="bizPlaceFile" accept="image/jpeg,image/png,image/webp" aria-label="사업장등록증"></label>
          </div>
        </div>
      </section>

      <div class="f-submit">
        <span class="note" id="submit-note">승인 전에는 손님에게 보이지 않아요.</span>
        <a class="btn btn-line" id="cancel">취소</a>
        <button class="btn btn-accent" type="submit" id="submit">등록 신청</button>
      </div>
    </form>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/owner/manage.js"></script>
  <!-- 주소 검색 창 (다음 우편번호 서비스, 키 없음) -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="../../js/owner/store-form.js"></script>
</body>
</html>
