<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사장 홈 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/manage.css">
</head>
<body>
  <!-- S12 사장 홈 ① 내 매장 · C-1. 관리자가 열면 "매장 관리" = 승인된 매장 전체 (관리자 개편 11/23)
       매장 카드만 나열. 카드를 누르면 ② 매장 화면(owner-store.html) -->
  <!-- 위쪽 메뉴 바를 본문보다 먼저 그림 (끝에 두면 메뉴 바 없는 화면이 먼저 보였다가 붙어서 번쩍임) -->
  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <main class="page m-page" id="main">
    <div class="m-head">
      <h1 class="page-title" id="title">내 매장</h1>
      <div class="m-actions" id="owner-actions">
        <a class="btn btn-accent" id="add-store">매장 등록</a>
      </div>
    </div>
    <!-- 관리자: 매장 이름으로 찾기 + 매장 등록 -->
    <div class="mg-tools" id="admin-tools" hidden>
      <label class="mg-search">
        <span class="sr-only">매장 이름 검색</span>
        <input id="find" type="search" maxlength="30" placeholder="매장·테마 이름 검색" autocomplete="off">
      </label>
      <a class="btn btn-accent" id="add-store-admin">+ 매장 등록</a>
    </div>

    <!-- 관리자가 열면 (매장 관리) 처음 그릴 때부터 관리자 모습으로: 사장 모습("내 매장")이 먼저 보였다 바뀌며 번쩍이던 것 방지
         사장은 아무것도 안 바뀜. 제목 아래는 다 불러온 뒤 보여 줌 (manage.css .adm-fade, owner.js 가 adm-ready) -->
    <script>
      (function () {
        var m = Auth.me();
        if (!m || m.role !== "ADMIN") return;
        document.getElementById("title").textContent = "매장 관리";
        document.title = "매장 관리 · Escaplix";
        document.getElementById("owner-actions").hidden = true;
        document.getElementById("admin-tools").hidden = false;
        document.getElementById("main").classList.add("adm-fade");
      })();
    </script>
    <div class="m-list" id="stores">
      <div class="sk sk-block"></div>
    </div>
  </main>

  <script src="../../js/common/footer.js"></script>
  <script src="../../js/owner/manage.js"></script>
  <script src="../../js/owner/owner.js"></script>
</body>
</html>
