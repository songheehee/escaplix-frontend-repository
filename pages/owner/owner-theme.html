<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테마 등록 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/manage.css">
</head>
<body>
  <!-- S12 사장 홈 ③ 테마 화면 (탭 2개)
       [기본 정보] S13 테마 등록·수정: B-7 장르, C-6 수정용 상세, C-7 등록, C-8 수정, C-9 운영 종료·재개
       [시간표]   S14: C-10 보기, C-11 통째 저장 (js/owner/theme-slots.js). 새 테마는 승인 요청 뒤에 열림 -->
  <main class="page m-page narrow" id="main">
    <nav class="m-crumbs" id="crumbs" aria-label="경로"></nav>
    <div class="m-head">
      <h1 class="page-title" id="title">새 테마</h1>
      <div class="m-actions" id="theme-actions" hidden>
        <span id="status"></span>
      </div>
    </div>

    <div class="m-tabs" id="tabs" role="tablist" aria-label="테마 화면" hidden>
      <button type="button" role="tab" id="tab-info" aria-controls="form" aria-selected="true">기본 정보</button>
      <button type="button" role="tab" id="tab-slots" aria-controls="slots-panel" aria-selected="false">시간표</button>
    </div>

    <form class="m-form" id="form" role="tabpanel" aria-labelledby="tab-info" novalidate>
      <div class="m-notice" id="re-approve" hidden>
        테마를 수정하면 <b>다시 승인 대기</b>가 돼요. 관리자가 승인할 때까지 손님에게 보이지 않아요.
      </div>
      <div class="m-error" id="error" role="alert" hidden></div>
      <input type="hidden" id="storeId">

      <!-- 관리자 개편 11/23: ① 기본 → ② 플레이 정보(손님 테마 상세 4칸과 같은 배치) → ③ 포스터 · 소개 -->
      <section class="f-sec">
        <h2>기본</h2>
        <div class="m-card m-form">
          <div class="m-field">
            <label for="title-input">테마 이름<span class="req">*</span></label>
            <input type="text" id="title-input" maxlength="50" placeholder="예: 거울 속 방">
          </div>
          <div class="m-field">
            <span class="lbl" id="genres-label">장르<span class="req">*</span></span>
            <div class="m-checks" id="genres" role="group" aria-labelledby="genres-label"></div>
          </div>
        </div>
      </section>

      <section class="f-sec">
        <h2>플레이 정보</h2>
        <div class="m-card m-form">
          <div class="f-stats">
            <div>
              <span class="lbl">난이도<span class="req">*</span></span>
              <div id="difficulty-box"></div>
            </div>
            <div>
              <label class="lbl" for="playMinutes">시간<span class="req">*</span></label>
              <div class="f-unit"><input class="w3 num" type="text" inputmode="numeric" maxlength="3" id="playMinutes" placeholder="70">분</div>
            </div>
            <div>
              <span class="lbl">인원<span class="req">*</span></span>
              <div class="f-unit"><input class="w2 num" type="text" inputmode="numeric" maxlength="2" id="minPeople" placeholder="2" aria-label="최소 인원">~<input class="w2 num" type="text" inputmode="numeric" maxlength="2" id="maxPeople" placeholder="4" aria-label="최대 인원">인</div>
            </div>
            <div>
              <label class="lbl" for="price">가격<span class="req">*</span></label>
              <div class="f-unit"><input class="w6" type="text" inputmode="numeric" maxlength="9" id="price" placeholder="25,000">원 / 1인</div>
            </div>
          </div>
          <div class="m-field">
            <label for="bookingUrl">예약 링크<span class="req">*</span></label>
            <input type="url" id="bookingUrl" maxlength="500" placeholder="https://">
          </div>
        </div>
      </section>

      <section class="f-sec">
        <h2>포스터 · 소개</h2>
        <div class="m-card m-form">
          <div class="f-pair">
            <div class="f-col">
              <span class="lbl">포스터</span>
              <label class="f-drop poster" id="poster-drop"><span><b>포스터 올리기</b>세로 2:3</span><input type="file" id="poster" accept="image/jpeg,image/png,image/webp" aria-label="포스터"></label>
            </div>
            <div class="f-col">
              <label for="description">소개</label>
              <div class="f-ta">
                <textarea id="description" maxlength="1300" placeholder="손님이 테마 상세에서 읽는 이야기예요."></textarea>
                <p class="hint m-count" id="description-count"></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="f-submit">
        <a class="btn btn-line" id="cancel">취소</a>
        <button class="btn btn-accent" type="submit" id="submit">승인 요청</button>
      </div>
    </form>

    <!-- [시간표] 탭 (관리자 개편 11/23: 시간은 직접 치거나(1315 → 13:15) 시·분을 골라 넣음, 회차 겹침 허용) -->
    <section id="slots-panel" role="tabpanel" aria-labelledby="tab-slots" hidden>
      <div class="m-error" id="slot-error" role="alert" hidden></div>
      <div id="slot-editor" hidden>
        <div class="week-grid">
          <div class="m-card week-col" data-kind="weekday">
            <div class="wc-head"><h2>주중 <small>월 ~ 금</small></h2><span class="wc-n"></span></div>
            <ul class="times"></ul>
            <div class="wc-foot">
              <div class="tin">
                <span class="ico" aria-hidden="true"></span>
                <input type="text" inputmode="numeric" maxlength="5" placeholder="13:00" aria-label="주중에 넣을 시작 시간">
                <div class="tp" hidden></div>
              </div>
              <button class="btn btn-accent small add" type="button">추가</button>
              <button class="btn btn-line small copy" type="button" data-to="weekend">주말에도 똑같이</button>
              <div class="warn-line" role="alert"></div>
            </div>
          </div>
          <div class="m-card week-col weekend" data-kind="weekend">
            <div class="wc-head"><h2>주말 <small>토 · 일 · 공휴일</small></h2><span class="wc-n"></span></div>
            <ul class="times"></ul>
            <div class="wc-foot">
              <div class="tin">
                <span class="ico" aria-hidden="true"></span>
                <input type="text" inputmode="numeric" maxlength="5" placeholder="13:00" aria-label="주말에 넣을 시작 시간">
                <div class="tp" hidden></div>
              </div>
              <button class="btn btn-accent small add" type="button">추가</button>
              <button class="btn btn-line small copy" type="button" data-to="weekday">주중에도 똑같이</button>
              <div class="warn-line" role="alert"></div>
            </div>
          </div>
        </div>
        <div class="slot-bar">
          <span id="slot-summary"></span>
          <button class="btn btn-accent" type="button" id="slot-save">시간표 저장</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/owner/manage.js"></script>
  <script src="../../js/owner/theme-slots.js"></script>
  <script src="../../js/owner/owner-theme.js"></script>
</body>
</html>
