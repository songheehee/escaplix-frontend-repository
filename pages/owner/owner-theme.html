<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테마 등록 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/manage.css">
</head>
<body>
  <!-- S12 사장 홈 ③ 테마 화면 (탭 2개)
       [기본 정보] S13 테마 등록·수정: B-7 장르, C-6 수정용 상세, C-7 등록, C-8 수정, C-9 운영 종료·재개
       [시간표]   S14: C-10 보기, C-11 통째 저장 (js/owner/theme-slots.js). 새 테마는 승인 요청 뒤에 열림 -->
  <main class="page m-page narrow" id="main">
    <nav class="m-crumbs" id="crumbs" aria-label="경로"></nav>
    <div class="m-head">
      <h1 class="page-title" id="title">새 테마</h1>
      <div class="m-actions" id="theme-actions" hidden>
        <span id="status"></span>
        <button class="btn btn-line small" type="button" id="toggle-status" hidden></button>
      </div>
    </div>

    <div class="m-tabs" id="tabs" role="tablist" aria-label="테마 화면" hidden>
      <button type="button" role="tab" id="tab-info" aria-controls="form" aria-selected="true">기본 정보</button>
      <button type="button" role="tab" id="tab-slots" aria-controls="slots-panel" aria-selected="false">시간표</button>
    </div>

    <form class="m-card m-form" id="form" role="tabpanel" aria-labelledby="tab-info" novalidate>
      <div class="m-notice" id="re-approve" hidden>
        테마를 수정하면 <b>다시 승인 대기</b>가 돼요. 관리자가 승인할 때까지 손님에게 보이지 않아요.
      </div>
      <div class="m-error" id="error" role="alert" hidden></div>

      <input type="hidden" id="storeId">

      <div class="m-field">
        <label for="title-input">테마 이름<span class="req">*</span></label>
        <input type="text" id="title-input" maxlength="50" required placeholder="예: 거울 속 방">
      </div>

      <div class="m-field">
        <label for="description">소개 (선택)</label>
        <textarea id="description" maxlength="1300" placeholder="손님이 테마 상세에서 읽는 이야기예요."></textarea>
        <p class="hint m-count" id="description-count"></p>
      </div>

      <div class="m-grid">
        <div class="m-field">
          <label for="difficulty">난이도<span class="req">*</span></label>
          <select id="difficulty" required>
            <option value="">고르기</option>
            <option value="1">1 · 아주 쉬움</option>
            <option value="2">2 · 쉬움</option>
            <option value="3">3 · 보통</option>
            <option value="4">4 · 어려움</option>
            <option value="5">5 · 아주 어려움</option>
          </select>
        </div>
        <div class="m-field">
          <label for="playMinutes">제한 시간(분)<span class="req">*</span></label>
          <input type="number" id="playMinutes" min="1" max="300" step="1" required placeholder="70">
        </div>
        <div class="m-field">
          <label for="minPeople">최소 인원<span class="req">*</span></label>
          <input type="number" id="minPeople" min="1" max="20" step="1" required placeholder="2">
        </div>
        <div class="m-field">
          <label for="maxPeople">최대 인원<span class="req">*</span></label>
          <input type="number" id="maxPeople" min="1" max="20" step="1" required placeholder="4">
        </div>
        <div class="m-field">
          <label for="price">1인 가격(원)<span class="req">*</span></label>
          <input type="number" id="price" min="0" step="1" required placeholder="25000">
        </div>
      </div>
      <p class="hint" style="margin-top:-8px">인원이 늘어도 1인 가격은 그대로예요.</p>

      <div class="m-field">
        <span class="lbl" id="genres-label">장르 (하나 이상)<span class="req">*</span></span>
        <div class="m-checks" id="genres" role="group" aria-labelledby="genres-label"></div>
      </div>

      <div class="m-field">
        <label for="bookingUrl">예약 링크<span class="req">*</span></label>
        <input type="url" id="bookingUrl" maxlength="500" required pattern="https?://.+" placeholder="https:// 로 시작">
        <p class="hint">테마 상세의 "예약하러 가기" 버튼이 이 링크를 열어요.</p>
      </div>

      <div class="m-field">
        <label for="poster">테마 사진 (선택)</label>
        <input type="file" id="poster" accept="image/jpeg,image/png,image/webp">
        <p class="hint" id="poster-hint">jpg·png·webp, 5MB 이하. 관리자가 승인할 때 같이 봐요.</p>
        <div class="m-preview wide" id="poster-preview"></div>
      </div>

      <div class="m-submit">
        <button class="btn btn-accent" type="submit" id="submit">승인 요청</button>
        <a class="btn btn-line" id="cancel">취소</a>
      </div>
    </form>

    <!-- [시간표] 탭 -->
    <section id="slots-panel" role="tabpanel" aria-labelledby="tab-slots" hidden>
      <p class="muted" style="margin:0 0 16px">주중·주말에 시작하는 시간만 정하면 매주 같은 시간표로 보여요. 공휴일은 주말 시간표를 따라요. 끝나는 시간은 제한 시간 <span id="slot-play"></span>분으로 계산해요.</p>
      <div class="m-error" id="slot-error" role="alert" hidden></div>
      <div id="slot-editor" hidden>
        <div class="week-grid">
          <div class="m-card week-col" data-kind="weekday">
            <h2>주중 <small>월 ~ 금</small></h2>
            <ul class="times"></ul>
            <div class="add-row m-form">
              <input type="time" aria-label="주중에 추가할 시작 시간" value="13:00">
              <button class="btn btn-accent small add" type="button">추가</button>
            </div>
            <div class="warn-line" role="alert"></div>
            <button class="btn btn-line small copy" type="button" data-to="weekend">주말에도 똑같이</button>
          </div>

          <div class="m-card week-col weekend" data-kind="weekend">
            <h2>주말 <small>토 · 일 · 공휴일</small></h2>
            <ul class="times"></ul>
            <div class="add-row m-form">
              <input type="time" aria-label="주말에 추가할 시작 시간" value="10:00">
              <button class="btn btn-accent small add" type="button">추가</button>
            </div>
            <div class="warn-line" role="alert"></div>
            <button class="btn btn-line small copy" type="button" data-to="weekday">주중에도 똑같이</button>
          </div>
        </div>
        <div class="save-bar">
          <span class="muted" id="slot-summary"></span>
          <button class="btn btn-accent" type="button" id="slot-save">시간표 저장</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/owner/manage.js"></script>
  <script src="../../js/owner/theme-slots.js"></script>
  <script src="../../js/owner/owner-theme.js"></script>
</body>
</html>
