<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간표 관리 · Escaplix</title>
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/manage.css">
</head>
<body>
  <!-- S14 시간표 관리 · C-10 주중/주말 시간표 보기, C-11 통째 저장 (테마를 안 골랐으면 C-1·C-5 로 고르기) -->
  <main class="page m-page" id="main">
    <a class="m-back" id="back">← 내 매장</a>
    <h1 class="page-title" id="title">시간표 관리</h1>
    <p class="muted" id="lead">
      날짜를 하나하나 넣지 않아요. <b>주중</b>과 <b>주말</b>에 시작하는 시간만 정해 두면 매주 같은 시간표로 손님에게 보여요.
      <b>공휴일은 평일이어도 주말 시간표</b>로 보여요.
    </p>

    <!-- 테마 고르기 (헤더 "시간표 관리"로 바로 들어왔을 때) -->
    <section class="m-card m-form" id="picker" hidden>
      <div class="m-grid two">
        <div class="m-field">
          <label for="pick-store">매장</label>
          <select id="pick-store"></select>
        </div>
        <div class="m-field">
          <label for="pick-theme">테마</label>
          <select id="pick-theme"></select>
        </div>
      </div>
      <div class="m-actions">
        <button class="btn btn-accent" type="button" id="pick-go">이 테마 시간표 열기</button>
      </div>
    </section>

    <section id="editor" hidden>
      <div class="week-grid" style="margin-top:20px">
        <div class="m-card week-col" data-kind="weekday">
          <h2>주중 <small>월 ~ 금</small></h2>
          <div class="days"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>
          <ul class="times"></ul>
          <div class="add-row m-form">
            <input type="time" aria-label="주중에 추가할 시작 시간" value="13:00">
            <button class="btn btn-accent small add" type="button">+ 추가</button>
          </div>
          <div class="warn-line" role="alert"></div>
          <button class="btn btn-line small copy" type="button" data-to="weekend">주말에도 똑같이 →</button>
        </div>

        <div class="m-card week-col weekend" data-kind="weekend">
          <h2>주말 <small>토 · 일 · 공휴일</small></h2>
          <div class="days"><span>토</span><span>일</span><span>공휴일</span></div>
          <ul class="times"></ul>
          <div class="add-row m-form">
            <input type="time" aria-label="주말에 추가할 시작 시간" value="10:00">
            <button class="btn btn-accent small add" type="button">+ 추가</button>
          </div>
          <div class="warn-line" role="alert"></div>
          <button class="btn btn-line small copy" type="button" data-to="weekday">← 주중에도 똑같이</button>
        </div>
      </div>

      <div class="m-error" id="error" role="alert" hidden style="margin-top:16px"></div>
      <div class="save-bar">
        <span class="muted" id="summary"></span>
        <div class="m-actions">
          <a class="btn btn-line" id="cancel">취소</a>
          <button class="btn btn-accent" type="button" id="save">시간표 저장</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../../js/common/routes.js"></script>
  <script src="../../js/common/api.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/header.js"></script>
  <script src="../../js/common/footer.js"></script>
  <script src="../../js/owner/manage.js"></script>
  <script src="../../js/owner/owner-slots.js"></script>
</body>
</html>
